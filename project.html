iv>${p.repo?`<a class="ghost" href="${p.repo}" target="_blank" rel="noopener">Source ↗</a>`:''}</div>${p.type==='web'&&p.preview?`<div class="preview"><iframe src="${p.preview}" title="${p.name} preview"></iframe></div>`:`<div class="download"><h2>Պատրաստ է ներբեռնման</h2><p>Այս նախագծի համար AWEEXP-ը տրամադրում է build/artifact ֆայլը։</p>${p.download?`<a class="primary" href="${p.download}" download>Ներբեռնել build-ը ↓</a>`:'<span class="muted">Build-ը դեռ չի ավելացվել</span>'}</div>`}</div>`}</script></body></html>
